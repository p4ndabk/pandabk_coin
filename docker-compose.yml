services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: base_project
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["./migrate"]
    environment: &api_env
      DB_DRIVER: postgres
      DB_DSN: "host=postgres user=postgres password=postgres dbname=base_project port=5432 sslmode=disable"
      JWT_SECRET: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["./api"]
    ports:
      - "8080:8080"
    environment:
      <<: *api_env
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
